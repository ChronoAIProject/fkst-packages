kind = "package"
name = "x-publisher"
persistence_class = "saga"

[code]
root = "."

[lib_deps]
libraries = ["contract", "forge", "workflow", "testkit"]

# Package-owned conformance — travels with the package; the engine runs it whenever x-publisher
# is an active package root (fkst-packages self-conformance AND any host repo that composes it).
[conformance]
function = "core.saga_conformance_errors"
pack = "conformance/pack.toml"
