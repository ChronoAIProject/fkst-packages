schema = 1
runner_protocol = "fkst-declarative-rulepack@1"
owner_package = "chrono-security"

[[rules]]
id = "source.max-lines"
severity = "error"
kind = "max_line_count"
include = ["**/*.lua"]
exclude = ["tests/**", "**/*_test.lua"]
max = 1000
message = "chrono-security source files must stay under the 1000-line limit"
