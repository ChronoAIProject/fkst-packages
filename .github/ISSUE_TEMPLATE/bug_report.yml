name: Bug report
description: Report a reproducible defect in fkst-packages.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include secrets, tokens, or private repository data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command, event, package, or fixture that reproduces the issue.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste relevant non-secret output from `scripts/run.sh doctor`, `scripts/run.sh test`, or a narrower command.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, logs, or constraints that help explain the failure.
    validations:
      required: false
