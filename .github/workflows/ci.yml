name: ci

on:
  push:
    branches: [main, dev, integration]
  pull_request:
    branches: [main, dev, integration]
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: "fkst-substrate ref to build fkst-framework from"
        default: ""
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fkst-packages
        uses: actions/checkout@v4

      - name: Resolve fkst-substrate source pin
        id: substrate_ref
        shell: bash
        run: |
          set -euo pipefail
          pin="${{ github.event.inputs.substrate_ref }}"
          if [ -n "$pin" ]; then
            python3 scripts/resolve_substrate_ref.py --pin "$pin" --format github-output >> "$GITHUB_OUTPUT"
          else
            python3 scripts/resolve_substrate_ref.py --file .fkst-substrate-ref --format github-output >> "$GITHUB_OUTPUT"
          fi
          echo "fkst-substrate ref: $(grep '^ref=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"

      # fkst-framework is built from the sibling engine source repo. A downstream
      # package repo should set .fkst-substrate-ref to a tag or SHA for a
      # reproducible engine source pin; this is not semver or binary distribution.
      - name: Checkout fkst-substrate
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.substrate_ref.outputs.repository }}
          ref: ${{ steps.substrate_ref.outputs.ref }}
          path: fkst-substrate

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fkst-substrate

      - name: Build fkst-framework
        working-directory: fkst-substrate
        run: cargo build -p fkst-framework

      - name: Run repository checks and package tests
        env:
          BIN: ${{ github.workspace }}/fkst-substrate/target/debug/fkst-framework
        run: |
          test -x "$BIN"
          scripts/run.sh test
